<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>

  <style>
    * {

      margin-top: 30px;
     background: rgba(23, 23, 34, 0.9);
padding: 32px;
border-radius: 22px;

box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
backdrop-filter: blur(14px);

/* Premium UI Upgrade */
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(124, 92, 255, 0.18), transparent 35%),
    radial-gradient(circle at 80% 30%, rgba(33, 212, 253, 0.12), transparent 35%),
    #080810;
}

nav {
  padding: 24px 8%;
  font-size: 24px;
  letter-spacing: -0.5px;
}

.hero {
  min-height: 85vh;
  padding: 40px 20px 80px;
}

.hero h1 {
  font-size: clamp(42px, 7vw, 72px);
  line-height: 1.05;
  max-width: 850px;
  text-align: center;
  margin-bottom: 22px;
}

.hero p {
  max-width: 650px;
  text-align: center;
  color: #a9a9b8;
  font-size: 18px;
  line-height: 1.7;
}

.generator {
  width: 100%;
  max-width: 720px;
  padding: 28px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 25px 70px rgba(0,0,0,0.35);
  backdrop-filter: blur(16px);
}

textarea {
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.35);
  color: white;
  border-radius: 16px;
}

textarea:focus {
  outline: none;
  border-color: #21d4fd;
  box-shadow: 0 0 0 3px rgba(33,212,253,0.12);
}

button {
  border-radius: 14px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

video {
  width: 100%;
  border-radius: 18px;
  margin-top: 20px;
}
.video-controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: 100%;
  margin: 16px 0;
}

.video-controls select {
  width: 100%;
  padding: 14px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.35);
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.video-controls select:focus {
  outline: none;
  border-color: #21d4fd;
  box-shadow: 0 0 0 3px rgba(33,212,253,0.12);
}

@media (max-width: 700px) {
  .video-controls {
    grid-template-columns: 1fr;
  }
}    
  </style>
</head>

<body>

  <nav>🎬 AI Video</nav>

  <section class="hero">

    <h1>
      Turn your ideas into
      <span class="gradient">AI videos</span>
    </h1>

    <p>
      Describe the video you want to create and let artificial
      intelligence bring your idea to life.
    </p>

    <div class="generator">

      <textarea
        placeholder="Example: A futuristic sports car driving through New York City at night..."
      ></textarea>

      <div class="video-controls">
  <select id="aspectRatio">
    <option value="16:9">🖥️ Landscape 16:9</option>
    <option value="9:16">📱 Portrait 9:16</option>
    <option value="1:1">⬜ Square 1:1</option>
  </select>

  <select id="duration">
    <option value="5">5 seconds</option>
    <option value="10">10 seconds</option>
  </select>

  <select id="style">
    <option value="cinematic">🎬 Cinematic</option>
    <option value="realistic">📸 Realistic</option>
    <option value="anime">✨ Anime</option>
    <option value="3d">🧊 3D Animation</option>
  </select>
</div>

      <button>✨ Generate Video</button>

    </div>

  </section>
<script>
  const button = document.querySelector("button");
  const textarea = document.querySelector("textarea");

  const status = document.createElement("p");
  status.style.marginTop = "15px";

  const video = document.createElement("video");
  video.controls = true;
  video.style.width = "100%";
  video.style.marginTop = "20px";
  video.style.display = "none";
const downloadButton = document.createElement("a");
downloadButton.textContent = "⬇️ Download Video";
downloadButton.style.display = "none";
downloadButton.style.marginTop = "15px";
downloadButton.style.padding = "12px 20px";
downloadButton.style.textDecoration = "none";
downloadButton.style.color = "white";
downloadButton.style.background = "#2563eb";
downloadButton.style.borderRadius = "8px";
downloadButton.addEventListener("click", async (e) => {
  e.preventDefault();
  const response = await fetch(video.src);
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ai-video.mp4";
  a.click();
  URL.revokeObjectURL(url);
});
  

  document.querySelector(".generator").appendChild(status);
  document.querySelector(".generator").appendChild(video);
  document.querySelector(".generator").appendChild(downloadButton);

  button.addEventListener("click", async () => {
    const prompt = textarea.value.trim();
const style = document.querySelector("#style").value;
const aspectRatio = document.querySelector("#aspectRatio").value;
const duration = document.querySelector("#duration").value;
    
    if (!prompt) {
      status.textContent = "Please describe the video you want.";
      return;
    }

    button.disabled = true;
    button.textContent = "Generating...";
    status.textContent =
      "Your AI video is being generated. This may take a few minutes.";

    video.style.display = "none";
    downloadButton.style.display = "none";

    try {
      const response = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
       body: JSON.stringify({ prompt: prompt, style: style, aspectRatio: aspectRatio, duration: duration })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.detail || data.error || "Generation failed"
        );
      }

      if (data.output) {
    video.src = Array.isArray(data.output)
        ? data.output[0]
        : data.output;
        downloadButton.href = video.src;
downloadButton.style.display = "inline-block";

    video.style.display = "block";
    status.textContent = "Your video is ready!";
} else if (data.id) {
    status.textContent = "Generating video...";

    let finished = false;

    while (!finished) {
        await new Promise(resolve => setTimeout(resolve, 3000));

        const statusResponse = await fetch(
            "/api/status?id=" + encodeURIComponent(data.id)
        );

        const result = await statusResponse.json();

        if (!statusResponse.ok) {
            throw new Error(
                result.detail || result.error || "Status check failed"
            );
        }

        if (result.status === "succeeded" && result.output) {
            video.src = Array.isArray(result.output)
                ? result.output[0]
                : result.output;
          downloadButton.href = video.src;
downloadButton.style.display = "inline-block";

            video.style.display = "block";
            status.textContent = "Your video is ready!";
            finished = true;
        } else if (
            result.status === "failed" ||
            result.status === "canceled"
        ) {
            throw new Error(result.error || "Video generation failed");
        } else {
            status.textContent = "Generating video...";
        }
    }
} else {
    throw new Error("No prediction ID received");
}
      
  
  } catch (error) {
      status.textContent = "Error: " + error.message;
    }

    button.disabled = false;
    button.textContent = "✨ Generate Video";
  });
</script>
</body>
</html>
