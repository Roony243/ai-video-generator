<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    nav {
      padding: 22px 8%;
      font-size: 22px;
      font-weight: bold;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .gradient {
      background: linear-gradient(90deg, #7c5cff, #21d4fd);
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      color: #aaa;
      font-size: 19px;
      max-width: 650px;
    }

    .generator {
      width: 100%;
      max-width: 700px;
      margin-top: 30px;
      background: #171722;
      padding: 25px;
      border-radius: 18px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #0f0f17;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      color: white;
      font-size: 16px;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #7c5cff, #21d4fd);
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <nav>🎬 AI Video</nav>

  <section class="hero">

    <h1>
      Turn your ideas into
      <span class="gradient">AI videos</span>
    </h1>

    <p>
      Describe the video you want to create and let artificial
      intelligence bring your idea to life.
    </p>

    <div class="generator">

      <textarea
        placeholder="Example: A futuristic sports car driving through New York City at night..."
      ></textarea>

      <button>✨ Generate Video</button>

    </div>

  </section>
<script>
  const button = document.querySelector("button");
  const textarea = document.querySelector("textarea");

  const status = document.createElement("p");
  status.style.marginTop = "15px";

  const video = document.createElement("video");
  video.controls = true;
  video.style.width = "100%";
  video.style.marginTop = "20px";
  video.style.display = "none";

  document.querySelector(".generator").appendChild(status);
  document.querySelector(".generator").appendChild(video);

  button.addEventListener("click", async () => {
    const prompt = textarea.value.trim();

    if (!prompt) {
      status.textContent = "Please describe the video you want.";
      return;
    }

    button.disabled = true;
    button.textContent = "Generating...";
    status.textContent =
      "Your AI video is being generated. This may take a few minutes.";

    video.style.display = "none";

    try {
      const response = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt: prompt })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.detail || data.error || "Generation failed"
        );
      }

      if (data.output) {
        video.src = Array.isArray(data.output)
          ? data.output[0]
          : data.output;

        video.style.display = "block";
        status.textContent = "Your video is ready!";
      } else {
        status.textContent =
          "The video started generating but is not finished yet.";
      }

    } catch (error) {
      status.textContent = "Error: " + error.message;
    }

    button.disabled = false;
    button.textContent = "✨ Generate Video";
  });
</script>
</body>
</html>
